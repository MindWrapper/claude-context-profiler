name: tests

# Only by hand, to spend the Actions allowance where it counts: `gh workflow run tests.yml`, or
# `gh workflow run tests.yml --ref BRANCH` for a branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
        # A macOS minute counts as ten against the Actions allowance, so macOS runs one Python.
        exclude:
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  # One check for the branch rule to require, whatever the matrix holds.
  all-tests:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
