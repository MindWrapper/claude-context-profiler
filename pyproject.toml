[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccwrap"
version = "0.1.0"
description = "See what fills Claude Code's context, and switch off what you don't use"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yan Drugalya" }]
dependencies = []

[project.scripts]
ccwrap = "ccwrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ccwrap"]
